name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the tool versions from mise.toml, the same ones used locally.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The PlantUML stdlib bundles are not committed; download them (checked against the lock).
      - run: node scripts/fetch-stdlib.mjs
      # The same command as locally: format, lint, types, TODO rule, unit tests.
      - name: Fast checks
        run: npm run check
      - name: Dead code, duplicates, licenses
        run: npm run check:deep
      # editor/index.html on main is the last *released* build; the release workflow rebuilds and
      # commits it. Here the build is only tested, so dependency PRs need no committed rebuild.
      - name: Build and test in a replica of Orca's sandboxed frame
        run: npm test
