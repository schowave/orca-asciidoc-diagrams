name: Release

# Weekly, after Renovate's Monday run: refresh the PlantUML stdlib bundles, rebuild the plugin, and cut a patch
# release when the plugin differs from the last released one (ADR 0005).
#
# Two jobs, so no third-party code runs with write access: `build` runs npm and the build scripts with a
# read-only token and hands the release commit over as a patch; `publish` only runs git and gh.
on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: Version step
        type: choice
        options: [patch, minor, major]
        default: patch
      attempt:
        description: Set by the workflow itself when it starts again because main moved during a release
        type: number
        default: 1

permissions:
  contents: read

env:
  # The files a release commit changes: the build job commits them, the publish job accepts nothing else.
  RELEASE_PATHS: >-
    editor/index.html vendor/plantuml-stdlib.lock.json images orca-plugin.json package.json package-lock.json
    CHANGELOG.md README.md docs/agent-stats.md

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the changelog
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: npm ci
      - name: Refresh PlantUML stdlib bundles
        run: node scripts/fetch-stdlib.mjs --update
      # Only the build: CI tests the release commit in the publish job, and main accepts it only after that.
      - name: Build
        run: npm run build
      - name: Bump version and changelog
        id: bump
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: echo "version=$(node scripts/release.mjs)" >> "$GITHUB_OUTPUT"
      - name: Agent contribution measures
        if: steps.bump.outputs.version != ''
        run: node scripts/agent-stats.mjs
      - name: Commit and export the release as a patch
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          read -ra paths <<< "$RELEASE_PATHS"
          git add -- "${paths[@]}"
          git commit -m "Release v$VERSION"
          mkdir -p "$RUNNER_TEMP/release"
          git format-patch -1 --binary --stdout > "$RUNNER_TEMP/release/release.patch"
          cp release-notes.md "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bump.outputs.version != ''
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 5

  publish:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch and the tag, merge the release PR, create the release
      pull-requests: write # open and merge the release PR
      actions: write # run CI, CodeQL and Scorecard on the release commit; start the release again
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # the commit the build job started from
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Apply and check the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$VERSION"
          git am "$RUNNER_TEMP/release/release.patch"
          # The patch comes from a job that ran third-party code: accept exactly one commit that changes only the
          # release files, and in package.json, package-lock.json and orca-plugin.json only the version.
          fail() { echo "::error::Release commit rejected: $1"; exit 1; }
          [ "$(git rev-list --count "$GITHUB_SHA..HEAD")" = 1 ] || fail "the patch holds more than one commit"
          read -ra allowed <<< "$RELEASE_PATHS"
          while IFS= read -r f; do
            ok=
            for a in "${allowed[@]}"; do [[ $f == "$a" || $f == "$a/"* ]] && ok=1; done
            [ -n "$ok" ] || fail "it changes $f"
          done < <(git diff --no-renames --name-only "$GITHUB_SHA" HEAD)
          same_except_version() { # file, jq filter that drops the version fields
            cmp -s <(git show "$GITHUB_SHA:$1" | jq -S "$2") <(jq -S "$2" "$1") || fail "$1 changes more than the version"
          }
          same_except_version orca-plugin.json 'del(.version)'
          same_except_version package.json 'del(.version)'
          same_except_version package-lock.json 'del(.version, .packages[""].version)'
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version '$VERSION' is not MAJOR.MINOR.PATCH"
          [ "$(jq -r .version orca-plugin.json)" = "$VERSION" ] || fail "orca-plugin.json does not say $VERSION"
      # main only takes changes through a pull request with a green `test` check from GitHub Actions (ruleset
      # "main: CI required"; a direct push is refused even when the commit has that check). Pull requests and pushes
      # made with GITHUB_TOKEN start no workflows, but a dispatch does, so CI is dispatched on the release branch.
      - name: Push the release branch and open its pull request
        run: |
          # --force: a branch left over from a failed run of the same version must not block this one.
          git push --force origin "release/v$VERSION"
          gh pr list --head "release/v$VERSION" --state open --json number --jq '.[0].number' | grep -q . ||
            gh pr create --base main --head "release/v$VERSION" --title "Release v$VERSION" \
              --body-file "$RUNNER_TEMP/release/release-notes.md"
      - name: Run CI on the release commit
        timeout-minutes: 40
        run: |
          gh workflow run ci.yml --ref "release/v$VERSION"
          sha=$(git rev-parse HEAD)
          for _ in $(seq 60); do # up to 10 minutes for the dispatched run to show up
            run=$(gh run list --workflow ci.yml --commit "$sha" --event workflow_dispatch --json databaseId --jq '.[0].databaseId' || true)
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::The dispatched CI run did not show up"; exit 1; }
          gh run watch "$run" --exit-status --interval 30
      # If main moved while CI ran (a Renovate merge, say), the build is stale: start the release again from the new
      # main, up to three attempts. Checked before signing, so a stale bundle gets no provenance.
      - name: Check that main has not moved
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          ATTEMPT: ${{ inputs.attempt || 1 }}
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$main" = "$GITHUB_SHA" ] && exit 0
          if [ "$ATTEMPT" -lt 3 ]; then
            echo "::warning::main moved during the release; starting it again (attempt $((ATTEMPT + 1)))"
            gh workflow run release.yml --ref main -f bump="$BUMP" -f attempt=$((ATTEMPT + 1))
          fi
          exit 1
      # Signed SLSA build provenance for the bundle Orca installs; `gh attestation verify` checks it.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: editor/index.html
      - name: Merge the release pull request, tag the release commit and publish
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE"
          cp "$BUNDLE" "$RUNNER_TEMP/index.html.intoto.jsonl"
          sha=$(git rev-parse HEAD)
          # GitHub needs a moment to register the check; --match-head-commit merges only the commit CI tested.
          merged=
          for _ in $(seq 12); do
            if gh pr merge "release/v$VERSION" --merge --match-head-commit "$sha"; then merged=1; break; fi
            sleep 10
          done
          [ -n "$merged" ] || { echo "::error::The release pull request could not be merged"; exit 1; }
          # The tag goes on the tested release commit itself, which the merge made part of main.
          git tag -a "v$VERSION" -m "v$VERSION" "$sha"
          git push origin "v$VERSION" ||
            { echo "::error::main has v$VERSION, but pushing the tag failed; push it by hand"; exit 1; }
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release/release-notes.md" \
            editor/index.html "$RUNNER_TEMP/index.html.intoto.jsonl" ||
            { echo "::error::v$VERSION is tagged, but the GitHub release failed; create it by hand"; exit 1; }
      # Merges made with GITHUB_TOKEN skip push triggers, so the release on main is scanned by dispatch.
      - name: Scan the release commit
        run: |
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
      - name: Close a release pull request left open and delete the release branch
        if: always()
        run: |
          gh pr close "release/v$VERSION" --comment "Release run ${{ github.run_id }} did not finish." 2>/dev/null || true
          git push origin --delete "release/v$VERSION" 2>/dev/null || true
