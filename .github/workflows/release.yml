name: Release

# Weekly, after Renovate's Monday run: refresh the PlantUML stdlib bundles, rebuild the plugin, and cut a patch
# release when the plugin differs from the last released one (ADR 0005).
#
# Two jobs, so no third-party code runs with write access: `build` runs npm and the build scripts with a
# read-only token and hands the release commit over as a patch; `publish` only runs git and gh.
on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: Version step
        type: choice
        options: [patch, minor, major]
        default: patch
      attempt:
        description: Set by the workflow itself when it starts again because main moved during a release
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the changelog
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: npm ci
      - name: Refresh PlantUML stdlib bundles
        run: node scripts/fetch-stdlib.mjs --update
      # Only the build: CI tests the release commit in the publish job, and main accepts it only after that.
      - name: Build
        run: npm run build
      - name: Bump version and changelog
        id: bump
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: echo "version=$(node scripts/release.mjs)" >> "$GITHUB_OUTPUT"
      - name: Agent contribution measures
        if: steps.bump.outputs.version != ''
        run: node scripts/agent-stats.mjs
      - name: Commit and export the release as a patch
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/index.html vendor/plantuml-stdlib.lock.json images orca-plugin.json package.json package-lock.json CHANGELOG.md README.md docs/agent-stats.md
          git commit -m "Release v$VERSION"
          mkdir -p "$RUNNER_TEMP/release"
          git format-patch -1 --binary --stdout > "$RUNNER_TEMP/release/release.patch"
          cp release-notes.md "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bump.outputs.version != ''
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 5

  publish:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch, main and the tag; create the release
      actions: write # run CI, CodeQL and Scorecard on the release commit; start the release again
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      # What the build job commits (see its `git add`), as one extended regular expression.
      RELEASE_FILES: >-
        editor/index\.html|vendor/plantuml-stdlib\.lock\.json|images/.*|orca-plugin\.json|package\.json|package-lock\.json|CHANGELOG\.md|README\.md|docs/agent-stats\.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # the commit the build job started from
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # main only accepts commits with a green `test` check from GitHub Actions (ruleset "main: CI required").
      # Pushes made with GITHUB_TOKEN start no workflows, but a dispatch does: the release commit goes to its own
      # branch, CI runs there, and main then fast-forwards to the tested commit.
      - name: Push the release commit to a release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$VERSION"
          git am "$RUNNER_TEMP/release/release.patch"
          # The patch comes from a job that ran third-party code. Push it only if it touches the release files.
          unexpected=$(git diff --name-only HEAD~1 HEAD | grep -vxE "$RELEASE_FILES" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The release commit changes files outside the release: $unexpected"
            exit 1
          fi
          # --force: a branch left over from a failed run of the same version must not block this one.
          git push --force origin "release/v$VERSION"
      - name: Run CI on the release commit
        timeout-minutes: 30
        run: |
          gh workflow run ci.yml --ref "release/v$VERSION"
          sha=$(git rev-parse HEAD)
          for _ in $(seq 30); do
            run=$(gh run list --workflow ci.yml --commit "$sha" --event workflow_dispatch --json databaseId --jq '.[0].databaseId' || true)
            [ -n "$run" ] && break
            sleep 5
          done
          test -n "$run"
          gh run watch "$run" --exit-status --interval 30
      # Signed SLSA build provenance for the bundle Orca installs, once CI has passed; `gh attestation verify` checks it.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: editor/index.html
      - name: Push to main
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          BUMP: ${{ inputs.bump || 'patch' }}
          ATTEMPT: ${{ inputs.attempt || 1 }}
        run: |
          # Stage the provenance first, so a missing bundle stops the run before anything is pushed.
          test -s "$BUNDLE"
          cp "$BUNDLE" "$RUNNER_TEMP/index.html.intoto.jsonl"
          if git push origin HEAD:main; then exit 0; fi
          # If main moved while CI ran (a Renovate merge, say), the build is stale: build again from the new main.
          # Any other rejection (permissions, rules, network) would fail the same way again, so it just fails.
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" != "$GITHUB_SHA" ] && [ "$ATTEMPT" -lt 3 ]; then
            echo "::warning::main moved during the release; starting it again (attempt $((ATTEMPT + 1)))"
            gh workflow run release.yml --ref main -f bump="$BUMP" -f attempt=$((ATTEMPT + 1))
          fi
          exit 1
      - name: Tag and publish
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release/release-notes.md" \
            editor/index.html "$RUNNER_TEMP/index.html.intoto.jsonl"
      # Pushes made with GITHUB_TOKEN skip their push triggers, so the release commit on main is scanned by dispatch.
      - name: Scan the release commit
        run: |
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
      - name: Delete the release branch
        if: always()
        run: git push origin --delete "release/v$VERSION" || true
