name: CodeQL

# Static security analysis of the TypeScript sources, the build scripts and the workflows.
# Findings show up under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 4 * * 3' # Wednesdays 04:30 UTC, to pick up new CodeQL queries
  # The release workflow dispatches a scan of its release commit: pushes made with GITHUB_TOKEN start no workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # editor/index.html and dist/ are build output with minified third-party code.
          config: |
            paths-ignore:
              - editor
              - dist
              - vendor
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
